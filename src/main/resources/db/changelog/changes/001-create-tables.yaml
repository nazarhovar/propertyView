databaseChangeLog:
  - changeSet:
      id: 001-create-hotels-table
      author: nazar
      changes:
        - createTable:
            tableName: hotels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(2000)

              - column:
                  name: brand
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-addresses-table
      author: nazar
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: house_number
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: post_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
  - changeSet:
      id: 003-create-contacts-table
      author: nazar
      changes:
        - createTable:
            tableName: contacts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
  - changeSet:
      id: 004-create-arrival-times-table
      author: nazar
      changes:
        - createTable:
            tableName: arrival_times
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: check_in
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: check_out
                  type: VARCHAR(10)
  - changeSet:
      id: 005-create-amenities-table
      author: nazar
      changes:
        - createTable:
            tableName: amenities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
  - changeSet:
      id: 006-create-hotel-amenities-table
      author: nazar
      changes:
        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amenity_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: hotel_amenities
            columnNames: hotel_id, amenity_id
            constraintName: pk_hotel_amenities

        - addForeignKeyConstraint:
            baseTableName: hotel_amenities
            baseColumnNames: hotel_id
            referencedTableName: hotels
            referencedColumnNames: id
            constraintName: fk_hotel_amenities_hotel

        - addForeignKeyConstraint:
            baseTableName: hotel_amenities
            baseColumnNames: amenity_id
            referencedTableName: amenities
            referencedColumnNames: id
            constraintName: fk_hotel_amenities_amenity
  - changeSet:
      id: 007-add-hotel-relations
      author: nazar
      changes:
        - addColumn:
            tableName: hotels
            columns:
              - column:
                  name: address_id
                  type: BIGINT

              - column:
                  name: contacts_id
                  type: BIGINT

              - column:
                  name: arrival_time_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: hotels
            baseColumnNames: address_id
            referencedTableName: addresses
            referencedColumnNames: id
            constraintName: fk_hotels_address

        - addForeignKeyConstraint:
            baseTableName: hotels
            baseColumnNames: contacts_id
            referencedTableName: contacts
            referencedColumnNames: id
            constraintName: fk_hotels_contacts

        - addForeignKeyConstraint:
            baseTableName: hotels
            baseColumnNames: arrival_time_id
            referencedTableName: arrival_times
            referencedColumnNames: id
            constraintName: fk_hotels_arrival_time